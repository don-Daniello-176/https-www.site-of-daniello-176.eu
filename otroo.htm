<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Texto Parpadeante</title>
    <style>
        .texto-parpadeante {
            /* Nazwa animacji, czas trwania (1s), nieskończone powtarzanie */
            animation: parpadeo 1s infinite;
        }

        @keyframes parpadeo {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }
		
    </style>

</head>
